# ---------------------------------------------------------------------
#  Configuração do site Quarto da Coleção TikZ.
#  Segue o mesmo padrão de TemplateNotas/_quarto.yml.
# ---------------------------------------------------------------------

project:
  type: website
  output-dir: _site
  resources:
    - _build/**
  render:
    - index.qmd
    - categorias/*.qmd

website:
  title: "Coleção TikZ"
  description: "Figuras TikZ organizadas por tema, com download em PNG/SVG/EPS"
  reader-mode: true
  navbar:
    background: "#1F3A5F"
    foreground: "#FFFFFF"
    title: "Coleção TikZ"
    left:
      - text: "Início"
        href: index.qmd
      - text: "Categorias"
        menu:
          - text: "Controle Clássico"
            href: categorias/controle-classico.qmd
          - text: "Controle por Espaço de Estados"
            href: categorias/controle-estados.qmd
          - text: "Controle Digital"
            href: categorias/controle-digital.qmd
          - text: "Circuitos CA"
            href: categorias/circuitos-ca.qmd
          - text: "Métodos Numéricos"
            href: categorias/metodos-numericos.qmd
          - text: "Aprendizagem de Máquina"
            href: categorias/aprendizagem-de-maquina.qmd
          - text: "Álgebra Linear"
            href: categorias/algebra-linear.qmd
          - text: "Identificação de Sistemas"
            href: categorias/identificacao.qmd
          - text: "MPC / DMC"
            href: categorias/mpc-dmc.qmd
  page-footer:
    border: false
    left: "Coleção TikZ"
    right: "Prof. Raphael Teixeira"

format:
  html:
    theme: [cosmo, TemaModelo.scss]
    toc: false
    page-layout: article
    lang: pt-BR
